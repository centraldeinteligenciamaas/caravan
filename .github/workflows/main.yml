name: Caravan – Supabase Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10,20 * * *"   # 7h e 17h BRT (UTC-3)
  push:
    branches:
      - main
    paths:
      - "caravan_supabase.py"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar sync
        env:
          SUPABASE_HOST:    ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORTA:   ${{ secrets.SUPABASE_PORTA }}
          SUPABASE_BANCO:   ${{ secrets.SUPABASE_BANCO }}
          SUPABASE_USUARIO: ${{ secrets.SUPABASE_USUARIO }}
          SUPABASE_SENHA:   ${{ secrets.SUPABASE_SENHA }}
          CARAVAN_API_KEY:  ${{ secrets.CARAVAN_API_KEY }}
        run: python caravan_supabase.py