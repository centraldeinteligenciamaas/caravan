services:
  - type: web
    name: caravan-supabase
    runtime: python
    buildCommand: pip install -r requirements.txt
    # 1 worker obrigatório para o APScheduler não duplicar as execuções
    # timeout 300s cobre a sincronização completa (ETAPA 1+2+3)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 300
    healthCheckPath: /
    envVars:
      - key: SUPABASE_HOST
        sync: false
      - key: SUPABASE_PORTA
        value: "5432"
      - key: SUPABASE_BANCO
        value: postgres
      - key: SUPABASE_USUARIO
        sync: false
      - key: SUPABASE_SENHA
        sync: false
      - key: CARAVAN_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
