name: Caravan – Supabase Migration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "caravan_supabase.py"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar migration
        env:
          SUPABASE_HOST:    ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORTA:   ${{ secrets.SUPABASE_PORTA }}
          SUPABASE_BANCO:   ${{ secrets.SUPABASE_BANCO }}
          SUPABASE_USUARIO: ${{ secrets.SUPABASE_USUARIO }}
          SUPABASE_SENHA:   ${{ secrets.SUPABASE_SENHA }}
        run: python caravan_supabase.py
